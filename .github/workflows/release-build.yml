name: Release builder and signer
on:
  workflow_call:
    outputs:
      public_artifact_id:
        description: Immutable signed public artifact ID.
        value: ${{ jobs.sign.outputs.public_artifact_id }}
      internal_artifact_id:
        description: Immutable private notes and metadata artifact ID.
        value: ${{ jobs.sign.outputs.internal_artifact_id }}
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 180
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/source
        id: source
        with:
          source: .
      - uses: ./.github/actions/bootstrap
        id: setup
        with:
          profile: release
          compiler: production
      - name: Qualify version and curated notes
        id: qualify
        shell: bash
        env:
          CI_CLI: ${{ steps.setup.outputs.cli }}
          INPUTNEXT_WORKFLOW_COMMIT: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          git_path="$(cygpath -w "$(command -v git)")"
          "$CI_CLI" release qualify --source-root "$GITHUB_WORKSPACE" --git "$git_path" \
            --out-identity "$RUNNER_TEMP/release-identity.json" --github-output "$GITHUB_OUTPUT"
      - name: Build and verify both native distributions
        shell: pwsh
        env:
          CI_CLI: ${{ steps.setup.outputs.cli }}
          TOOLSET: ${{ steps.setup.outputs.toolset }}
          COMPILER: ${{ steps.setup.outputs.compiler }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Get-Content -LiteralPath $env:TOOLSET -Raw | ConvertFrom-Json
          foreach ($architecture in 'x64', 'x86') {
              & $tools.tools.powershell.path -NoProfile -File ./tools/ci/Invoke-Native.ps1 -Cli $env:CI_CLI -Toolset $env:TOOLSET -Compiler $env:COMPILER -Check package -Architecture $architecture
              if ($LASTEXITCODE -ne 0) { throw "Package verification failed: $architecture" }
          }
      - name: Prepare exact unsigned handoff
        shell: bash
        env:
          CI_CLI: ${{ steps.setup.outputs.cli }}
        run: |
          set -euo pipefail
          "$CI_CLI" release prepare --identity "$RUNNER_TEMP/release-identity.json" \
            --source-root "$GITHUB_WORKSPACE" --packages "$GITHUB_WORKSPACE/build/ci/packages" \
            --out "$RUNNER_TEMP/release-unsigned"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-unsigned/*
          if-no-files-found: error
          retention-days: 14
  sign:
    needs: build
    if: ${{ needs.build.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      public_artifact_id: ${{ steps.public.outputs.artifact-id }}
      internal_artifact_id: ${{ steps.internal.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github
            tools/ci
            cmake
            packaging
            Cargo.toml
            Cargo.lock
            clippy.toml
            rust-toolchain.toml
            CMakeLists.txt
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: ./trusted/.github/actions/source
        id: source
      - uses: ./trusted/.github/actions/bootstrap
        id: setup
        with:
          source: trusted
          profile: release
          cache: 'false'
      - name: Independently qualify current workflow identity
        id: qualify
        shell: bash
        env:
          CI_CLI: ${{ steps.setup.outputs.cli }}
          INPUTNEXT_WORKFLOW_COMMIT: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          "$CI_CLI" release qualify --source-root "$GITHUB_WORKSPACE/trusted" --git "$(command -v git)" \
            --out-identity "$RUNNER_TEMP/release-identity.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-unsigned
          digest-mismatch: error
      - name: Validate unsigned data before signing
        shell: bash
        env:
          CI_CLI: ${{ steps.setup.outputs.cli }}
        run: |
          set -euo pipefail
          "$CI_CLI" release check-unsigned --identity "$RUNNER_TEMP/release-identity.json" \
            --source-root "$GITHUB_WORKSPACE/trusted" --unsigned "$RUNNER_TEMP/release-unsigned"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: provenance
        with:
          subject-path: |
            ${{ runner.temp }}/release-unsigned/InputNext-${{ steps.qualify.outputs.version }}-windows-x64.zip
            ${{ runner.temp }}/release-unsigned/InputNext-${{ steps.qualify.outputs.version }}-windows-x64-symbols.zip
            ${{ runner.temp }}/release-unsigned/InputNext-${{ steps.qualify.outputs.version }}-windows-x86.zip
            ${{ runner.temp }}/release-unsigned/InputNext-${{ steps.qualify.outputs.version }}-windows-x86-symbols.zip
            ${{ runner.temp }}/release-unsigned/InputNext-${{ steps.qualify.outputs.version }}-windows-x64.spdx.json
            ${{ runner.temp }}/release-unsigned/InputNext-${{ steps.qualify.outputs.version }}-windows-x86.spdx.json
            ${{ runner.temp }}/release-unsigned/SHA256SUMS
          show-summary: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: sbom-x64
        with:
          subject-path: ${{ runner.temp }}/release-unsigned/InputNext-${{ steps.qualify.outputs.version }}-windows-x64.zip
          sbom-path: ${{ runner.temp }}/release-unsigned/InputNext-${{ steps.qualify.outputs.version }}-windows-x64.spdx.json
          show-summary: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: sbom-x86
        with:
          subject-path: ${{ runner.temp }}/release-unsigned/InputNext-${{ steps.qualify.outputs.version }}-windows-x86.zip
          sbom-path: ${{ runner.temp }}/release-unsigned/InputNext-${{ steps.qualify.outputs.version }}-windows-x86.spdx.json
          show-summary: false
      - name: Assemble public data and private release metadata
        shell: bash
        env:
          CI_CLI: ${{ steps.setup.outputs.cli }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_X64: ${{ steps.sbom-x64.outputs.bundle-path }}
          SBOM_X86: ${{ steps.sbom-x86.outputs.bundle-path }}
        run: |
          set -euo pipefail
          "$CI_CLI" release assemble --identity "$RUNNER_TEMP/release-identity.json" \
            --source-root "$GITHUB_WORKSPACE/trusted" --unsigned "$RUNNER_TEMP/release-unsigned" \
            --provenance-bundle "$PROVENANCE" --sbom-x64-bundle "$SBOM_X64" --sbom-x86-bundle "$SBOM_X86" \
            --out "$RUNNER_TEMP/release-signed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: public
        with:
          name: release-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-signed/public/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: internal
        with:
          name: release-internal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-signed/internal/*
          if-no-files-found: error
          retention-days: 14
