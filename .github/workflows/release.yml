name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  manual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    steps:
      - run: echo 'Manual runs are read-only. A validated stable version tag is required to sign or create a draft.'
  qualify:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: ./trusted/.github/actions/source
        id: source
      - uses: ./trusted/.github/actions/bootstrap
        id: setup
        with:
          source: trusted
          profile: release
          cache: 'false'
      - name: Qualify source, version and curated notes
        shell: bash
        env:
          CI_CLI: ${{ steps.setup.outputs.cli }}
          INPUTNEXT_WORKFLOW_COMMIT: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          "$CI_CLI" release qualify --source-root "$GITHUB_WORKSPACE/trusted" --git "$(command -v git)" \
            --out-identity "$RUNNER_TEMP/release-identity.json" --github-output "$GITHUB_OUTPUT"
  quality:
    needs: qualify
    uses: ./.github/workflows/quality.yml
    with:
      deep: true
    permissions:
      contents: read
      security-events: write
  build-and-attest:
    needs: [qualify, quality]
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
  verify:
    needs: [qualify, build-and-attest]
    if: ${{ needs.build-and-attest.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      public_artifact_id: ${{ needs.build-and-attest.outputs.public_artifact_id }}
      internal_artifact_id: ${{ needs.build-and-attest.outputs.internal_artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github
            tools/ci
            cmake
            packaging
            Cargo.toml
            Cargo.lock
            clippy.toml
            rust-toolchain.toml
            CMakeLists.txt
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: ./trusted/.github/actions/source
        id: source
      - uses: ./trusted/.github/actions/bootstrap
        id: setup
        with:
          source: trusted
          profile: release
          cache: 'false'
      - name: Independently qualify current workflow identity
        shell: bash
        env:
          CI_CLI: ${{ steps.setup.outputs.cli }}
          INPUTNEXT_WORKFLOW_COMMIT: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          "$CI_CLI" release qualify --source-root "$GITHUB_WORKSPACE/trusted" --git "$(command -v git)" \
            --out-identity "$RUNNER_TEMP/release-identity.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-and-attest.outputs.public_artifact_id }}
          path: ${{ runner.temp }}/release-data/public
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-and-attest.outputs.internal_artifact_id }}
          path: ${{ runner.temp }}/release-data/internal
          digest-mismatch: error
      - name: Verify complete release and attestations
        shell: bash
        env:
          CI_CLI: ${{ steps.setup.outputs.cli }}
          TOOLSET: ${{ steps.setup.outputs.toolset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh_path="$("$CI_CLI" toolchain path --report "$TOOLSET" --name gh)"
          "$CI_CLI" release verify --identity "$RUNNER_TEMP/release-identity.json" \
            --source-root "$GITHUB_WORKSPACE/trusted" --release-dir "$RUNNER_TEMP/release-data" --gh "$gh_path"
  draft:
    needs: [qualify, verify]
    if: ${{ needs.verify.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            .github
            tools/ci
            cmake
            packaging
            Cargo.toml
            Cargo.lock
            clippy.toml
            rust-toolchain.toml
            CMakeLists.txt
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: ./trusted/.github/actions/source
        id: source
      - uses: ./trusted/.github/actions/bootstrap
        id: setup
        with:
          source: trusted
          profile: release
          cache: 'false'
      - name: Independently qualify current workflow identity
        shell: bash
        env:
          CI_CLI: ${{ steps.setup.outputs.cli }}
          INPUTNEXT_WORKFLOW_COMMIT: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          "$CI_CLI" release qualify --source-root "$GITHUB_WORKSPACE/trusted" --git "$(command -v git)" \
            --out-identity "$RUNNER_TEMP/release-identity.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.public_artifact_id }}
          path: ${{ runner.temp }}/release-data/public
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.internal_artifact_id }}
          path: ${{ runner.temp }}/release-data/internal
          digest-mismatch: error
      - name: Revalidate and create or complete an exact draft
        shell: bash
        env:
          CI_CLI: ${{ steps.setup.outputs.cli }}
          TOOLSET: ${{ steps.setup.outputs.toolset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh_path="$("$CI_CLI" toolchain path --report "$TOOLSET" --name gh)"
          "$CI_CLI" release draft --identity "$RUNNER_TEMP/release-identity.json" \
            --source-root "$GITHUB_WORKSPACE/trusted" --release-dir "$RUNNER_TEMP/release-data" --gh "$gh_path"
