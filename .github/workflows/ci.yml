name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * 0'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      deep: ${{ github.event_name == 'schedule' }}
    permissions:
      contents: read
      security-events: write
