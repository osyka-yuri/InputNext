name: Tool updates
on:
  schedule:
    - cron: '30 12 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tool-updates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/bootstrap
        id: setup
        with:
          profile: release
      - name: Report official stable versions
        shell: bash
        env:
          CI_CLI: ${{ steps.setup.outputs.cli }}
          GH_TOKEN: ${{ github.token }}
        run: '"$CI_CLI" updates --lock .github/ci/toolchain-lock.json --report build/ci/tool-updates.json'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-update-report
          path: build/ci/tool-updates.json
          if-no-files-found: error
          retention-days: 30
